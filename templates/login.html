<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genify — Login</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#0A0B0D;
            --bg-soft:#131418;
            --bg-sunken:#1B1C21;
            --border:#24262C;
            --border-strong:#33353D;
            --text:#EDEEF1;
            --text-muted:#9497A3;
            --text-faint:#5B5E68;
            --accent:#3B6FF0;
            --accent-2:#6E9BFF;
            --accent-soft:#3B6FF01A;
            --danger:#F0533B;
            --danger-soft:#F0533B1A;
            --ease:cubic-bezier(.4,0,.2,1);
        }
        body{font-family:-apple-system,BlinkMacSystemFont,'Inter','Segoe UI',Arial,sans-serif;background:radial-gradient(ellipse 900px 600px at 50% 20%,#3B6FF014,transparent 70%),var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--text)}
        .card{background:var(--bg-soft);border:1px solid var(--border);border-radius:20px;padding:48px 40px;text-align:center;width:420px;box-shadow:0 24px 60px rgba(0,0,0,0.5)}
        .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px}
        /* Logo size kept identical (32px) to the sidebar/nav logo used across
           dashboard, landing, pricing and profile — per request, no page
           gets a bigger or smaller logo than the others. */
        .logo-icon{width:32px;height:32px;border-radius:8px;overflow:hidden;flex-shrink:0}
        .logo-icon img{width:100%;height:100%;object-fit:cover;display:block}
        .logo-text{font-size:20px;font-weight:700;color:var(--text);letter-spacing:-0.3px}
        .subtitle{color:var(--text-muted);font-size:14px;margin-bottom:32px;line-height:1.6}
        .features{display:flex;justify-content:center;gap:24px;margin-bottom:32px}
        .feature-icon{font-size:20px}
        .feature-text{font-size:11px;color:var(--text-muted);font-weight:600;margin-top:4px}
        .divider{display:flex;align-items:center;gap:12px;margin-bottom:20px}
        .divider hr{flex:1;border:none;border-top:1px solid var(--border)}
        .divider span{color:var(--text-faint);font-size:13px}
        .google-btn{width:100%;padding:14px;border:1px solid var(--border-strong);border-radius:12px;background:var(--bg-sunken);font-size:15px;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:all .2s var(--ease)}
        .google-btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 6px 20px -6px #3B6FF066}
        .google-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none;box-shadow:none}
        .status{color:var(--text-muted);font-size:13px;margin-top:16px;min-height:20px}
        .error-box{background:var(--danger-soft);border:1px solid #F0533B33;border-radius:10px;padding:12px;color:var(--danger);font-size:13px;margin-top:16px;display:none}
        .footer-text{margin-top:28px;color:var(--text-faint);font-size:12px;line-height:1.6}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon"><img src="{{ url_for('static', filename='logo.jpeg') }}" alt="Genify"></div>
        <div class="logo-text">Genify</div>
    </div>
    <p class="subtitle">AI Question Paper Generator<br>for CBSE / ICSE Coaching Institutes</p>

    <div class="features">
        <div>
            <div class="feature-icon">⚡</div>
            <div class="feature-text">30 seconds</div>
        </div>
        <div>
            <div class="feature-icon">🎯</div>
            <div class="feature-text">CBSE aligned</div>
        </div>
        <div>
            <div class="feature-icon">🌐</div>
            <div class="feature-text">Hindi + English</div>
        </div>
    </div>

    <div class="divider">
        <hr><span>Sign in to continue</span><hr>
    </div>

    <button class="google-btn" id="googleBtn" onclick="loginWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
    </button>

    <div class="status" id="status"></div>
    <div class="error-box" id="errorBox"></div>

    <p class="footer-text">
        Built for coaching institutes across India 🇮🇳
    </p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
    // ── CONFIG ────────────────────────────────────
    // Kept the real, working project config here (not placeholders) —
    // swapping these for "YOUR_API_KEY"-style placeholders would break
    // sign-in entirely.
    firebase.initializeApp({
        apiKey:            "AIzaSyBHeVczCKIydzeIDD_r07EbxD8pUI7DMlU",
        authDomain:        "genify-a3890.firebaseapp.com",
        projectId:         "genify-a3890",
        storageBucket:     "genify-a3890.firebasestorage.app",
        messagingSenderId: "48163363237",
        appId:             "1:48163363237:web:f366d6e84f57403130304c"
    });

    const auth     = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope('email');
    provider.addScope('profile');

    // ── SIGN IN ───────────────────────────────────
    async function loginWithGoogle() {
        const btn    = document.getElementById('googleBtn');
        const status = document.getElementById('status');
        const errBox = document.getElementById('errorBox');

        btn.disabled      = true;
        errBox.style.display = 'none';
        status.textContent   = '⏳ Opening Google login...';

        try {
            // Try popup first
            const result = await auth.signInWithPopup(provider);
            const user   = result.user;

            status.textContent = '✅ Signed in! Loading dashboard...';
            await sendToServer(user);

        } catch (error) {
            console.error('Login error:', error.code, error.message);

            // If popup blocked — try redirect instead
            if (error.code === 'auth/popup-blocked' ||
                error.code === 'auth/popup-closed-by-user') {
                status.textContent = '⏳ Trying redirect method...';
                await auth.signInWithRedirect(provider);
            } else {
                showError(error.message || 'Something went wrong.');
                btn.disabled = false;
                status.textContent = '';
            }
        }
    }

    async function sendToServer(user) {
        const btn = document.getElementById('googleBtn');
        try {
            const res  = await fetch('/login/google', {
                method:  'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name:  user.displayName || 'Teacher',
                    email: user.email,
                    photo: user.photoURL   || '',
                    uid:   user.uid
                })
            });

            const data = await res.json();

            if (data.success) {
                document.getElementById('status').textContent = '🚀 Redirecting...';
                window.location.href = '/dashboard';
            } else {
                showError('Server error. Please try again.');
                btn.disabled = false;
            }
        } catch (err) {
            showError('Could not reach the server. Check your connection and try again.');
            btn.disabled = false;
        }
    }

    // ── HANDLE REDIRECT RESULT ────────────────────
    auth.getRedirectResult()
    .then(async function(result) {
        if (result && result.user) {
            document.getElementById('status').textContent = '✅ Signed in! Loading dashboard...';
            await sendToServer(result.user);
        }
    })
    .catch(function(err) {
        console.error('Redirect result error:', err);
    });

    function showError(msg) {
        const box      = document.getElementById('errorBox');
        box.textContent   = '⚠️ ' + msg;
        box.style.display = 'block';
    }
</script>
</body>
</html>
