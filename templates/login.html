<!DOCTYPE html>
<html>
<head>
    <title>Genify — Login</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:'Segoe UI',Arial,sans-serif;background:#0A0A0F;min-height:100vh;display:flex;align-items:center;justify-content:center}
        .card{background:#0F0F1A;border:1px solid #1E1E2E;border-radius:20px;padding:48px 40px;text-align:center;width:420px;box-shadow:0 20px 60px rgba(0,0,0,0.4)}
        .logo{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:24px}
        .logo-icon{width:44px;height:44px;background:linear-gradient(135deg,#4361EE,#7B2FBE);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#fff}
        .logo-text{font-size:24px;font-weight:800;color:#fff;letter-spacing:-0.5px}
        .subtitle{color:#8B8FA8;font-size:14px;margin-bottom:32px;line-height:1.6}
        .features{display:flex;justify-content:center;gap:24px;margin-bottom:32px}
        .feature-icon{font-size:20px}
        .feature-text{font-size:11px;color:#8B8FA8;font-weight:600;margin-top:4px}
        .divider{display:flex;align-items:center;gap:12px;margin-bottom:20px}
        .divider hr{flex:1;border:none;border-top:1px solid #1E1E2E}
        .divider span{color:#4A4A6A;font-size:13px}
        .google-btn{width:100%;padding:14px;border:1px solid #2D2D3D;border-radius:12px;background:#1A1A2E;font-size:15px;font-weight:600;color:#E2E8F0;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:12px;transition:all .2s}
        .google-btn:hover{background:#1E1E2E;border-color:#4361EE}
        .google-btn:disabled{opacity:0.6;cursor:not-allowed}
        .status{color:#8B8FA8;font-size:13px;margin-top:16px;min-height:20px}
        .error-box{background:#EF444411;border:1px solid #EF444433;border-radius:10px;padding:12px;color:#EF4444;font-size:13px;margin-top:16px;display:none}
        .footer-text{margin-top:28px;color:#4A4A6A;font-size:12px;line-height:1.6}
    </style>
</head>
<body>
<div class="card">
    <div class="logo">
        <div class="logo-icon">G</div>
        <div class="logo-text">Genify</div>
    </div>
    <p class="subtitle">AI Question Paper Generator<br>for CBSE / ICSE Coaching Institutes</p>

    <div class="features">
        <div>
            <div class="feature-icon">⚡</div>
            <div class="feature-text">30 seconds</div>
        </div>
        <div>
            <div class="feature-icon">🎯</div>
            <div class="feature-text">CBSE aligned</div>
        </div>
        <div>
            <div class="feature-icon">🌐</div>
            <div class="feature-text">Hindi + English</div>
        </div>
    </div>

    <div class="divider">
        <hr><span>Sign in to continue</span><hr>
    </div>

    <button class="google-btn" id="googleBtn" onclick="signInWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
    </button>

    <div class="status" id="status"></div>
    <div class="error-box" id="errorBox"></div>

    <p class="footer-text">
        Built for coaching institutes across India 🇮🇳
    </p>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

<script>
    // ── CONFIG ────────────────────────────────────
    firebase.initializeApp({
        apiKey:            "AIzaSyBHeVczCKIydzeIDD_r07EbxD8pUI7DMlU",
        authDomain:        "genify-a3890.firebaseapp.com",
        projectId:         "genify-a3890",
        storageBucket:     "genify-a3890.firebasestorage.app",
        messagingSenderId: "48163363237",
        appId:             "1:48163363237:web:f366d6e84f57403130304c"
    });

    const auth     = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.addScope('email');
    provider.addScope('profile');

    // ── SIGN IN ───────────────────────────────────
    async function signInWithGoogle() {
        const btn    = document.getElementById('googleBtn');
        const status = document.getElementById('status');
        const errBox = document.getElementById('errorBox');

        btn.disabled      = true;
        errBox.style.display = 'none';
        status.textContent   = '⏳ Opening Google login...';

        try {
            // Try popup first
            const result = await auth.signInWithPopup(provider);
            const user   = result.user;

            status.textContent = '✅ Signed in! Loading dashboard...';

            // Send to Flask
            const res  = await fetch('/google-login', {
                method:  'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name:  user.displayName || 'Teacher',
                    email: user.email,
                    photo: user.photoURL   || ''
                })
            });

            const data = await res.json();

            if (data.success) {
                status.textContent = '🚀 Redirecting...';
                window.location.href = '/dashboard';
            } else {
                showError('Server error. Please try again.');
                btn.disabled = false;
            }

        } catch (error) {
            console.error('Login error:', error.code, error.message);

            // If popup blocked — try redirect instead
            if (error.code === 'auth/popup-blocked' ||
                error.code === 'auth/popup-closed-by-user') {
                status.textContent = '⏳ Trying redirect method...';
                await auth.signInWithRedirect(provider);
            } else {
                showError(error.message || 'Something went wrong.');
                btn.disabled = false;
                status.textContent = '';
            }
        }
    }

    // ── HANDLE REDIRECT RESULT ────────────────────
    auth.getRedirectResult()
    .then(async function(result) {
        if (result && result.user) {
            const user   = result.user;
            const status = document.getElementById('status');
            status.textContent = '✅ Signed in! Loading dashboard...';

            const res  = await fetch('/google-login', {
                method:  'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name:  user.displayName || 'Teacher',
                    email: user.email,
                    photo: user.photoURL   || ''
                })
            });

            const data = await res.json();
            if (data.success) {
                window.location.href = '/dashboard';
            }
        }
    })
    .catch(function(err) {
        console.error('Redirect result error:', err);
    });

    function showError(msg) {
        const box      = document.getElementById('errorBox');
        box.textContent   = '⚠️ ' + msg;
        box.style.display = 'block';
    }
</script>
</body>
</html>
